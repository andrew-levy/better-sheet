name: Navigation prototype recordings
on:
  push:
    branches: ['prototype/dialog-adapter']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navigation-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build comparison and run core checks
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :sample:assembleDebug :sample:assembleDebugAndroidTest :sample:lintDebug :better-sheet:testDebugUnitTest :better-sheet:lintRelease
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_4
          ram-size: 3072M
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            python3 scripts/record-navigation.py --skip-build
            ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1g :sample:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.better.sheet.sample.NavigationComparisonTest,dev.better.sheet.sample.SheetUiTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-prototype
          path: |
            docs/videos/navigation/
            samples/sample/build/outputs/apk/
            samples/sample/build/reports/
            better-sheet/build/reports/
