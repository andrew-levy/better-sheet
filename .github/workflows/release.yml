name: Release
on:
  push:
    tags: ['[0-9]*', 'v*']
  workflow_dispatch:
    inputs:
      version:
        description: Unprefixed version matching VERSION_NAME (for example 0.4.0)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Check the tag matches VERSION_NAME
        run: |
          if [ "$GITHUB_REPOSITORY" != "andrew-levy/better-sheet" ]; then
            echo "::error::Rename the repository to andrew-levy/better-sheet before publishing Better Sheet"
            exit 1
          fi
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Manual releases must run from main"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [ "$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG must be an unprefixed semantic version matching VERSION_NAME=$version in gradle.properties"
            exit 1
          fi
      - name: Test, lint and package
        run: ./gradlew :better-sheet:testDebugUnitTest :better-sheet:lintRelease :better-sheet:publishToMavenLocal
      - name: Create the tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN-created tags do not trigger another workflow; this run publishes it.
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA"
      - name: Publish to Maven Central
        if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != '' && env.ORG_GRADLE_PROJECT_signingInMemoryKey != ''
        # Uploads a deployment; it is released from the Central Portal (automaticRelease = false).
        run: ./gradlew :better-sheet:publishToMavenCentral --no-configuration-cache
      - name: Note skipped Maven Central publication
        if: env.ORG_GRADLE_PROJECT_mavenCentralUsername == '' || env.ORG_GRADLE_PROJECT_signingInMemoryKey == ''
        run: echo "::warning::Maven Central secrets are not configured; Maven Central publication skipped; JitPack availability is checked separately."
      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$HOME/.m2/repository/$(sed -n 's/^GROUP=//p' gradle.properties | tr . /)/better-sheet/$VERSION"
          gh release create "$RELEASE_TAG" --verify-tag --title "$VERSION" --notes-file release-notes.md \
            "$dir"/better-sheet-"$VERSION".aar "$dir"/better-sheet-"$VERSION".pom \
            "$dir"/better-sheet-"$VERSION"-sources.jar "$dir"/better-sheet-"$VERSION"-javadoc.jar
      - name: Verify JitPack publication
        timeout-minutes: 12
        run: |
          base="https://jitpack.io/com/github/andrew-levy/better-sheet/$VERSION/better-sheet-$VERSION"
          for extension in pom aar; do
            curl --fail --show-error --location --retry 4 --retry-all-errors --retry-delay 10 \
              --retry-max-time 300 --max-time 120 "$base.$extension" -o "$RUNNER_TEMP/better-sheet.$extension"
          done
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"])
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          pom = ET.parse(directory / "better-sheet.pom").getroot()
          for field, expected in {
              "groupId": "com.github.andrew-levy",
              "artifactId": "better-sheet",
              "version": os.environ["VERSION"],
              "packaging": "aar",
          }.items():
              if pom.findtext(f"m:{field}", namespaces=namespace) != expected:
                  raise SystemExit(f"Unexpected JitPack POM {field}")
          with zipfile.ZipFile(directory / "better-sheet.aar") as aar:
              if not {"classes.jar", "AndroidManifest.xml"} <= set(aar.namelist()):
                  raise SystemExit("JitPack AAR is missing compiled library files")
              if aar.testzip() is not None:
                  raise SystemExit("JitPack AAR is corrupt")
          PY
