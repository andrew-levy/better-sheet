name: Android
on:
  push:
    paths-ignore:
      - 'docs/videos/**'
  pull_request:
  workflow_dispatch:
    inputs:
      record_demos:
        description: Record and publish demo videos after validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew :better-sheet:testDebugUnitTest :better-sheet:lintRelease :sample:assembleDebug :sample:assembleDebugAndroidTest :findmy:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            **/build/reports/
            sample/build/outputs/apk/
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_4
          disk-size: 2048M
          ram-size: 3072M
          disable-animations: false
          script: |
            adb wait-for-device
            for i in $(seq 1 30); do adb shell pm list packages android > /dev/null 2>&1 && adb shell dumpsys window > /dev/null 2>&1 && break; sleep 2; done
            sleep 15
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            ./gradlew :sample:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.better.sheet.sample.SheetUiTest,dev.better.sheet.sample.SheetMotionTest,dev.better.sheet.sample.FragmentSheetTest,dev.better.sheet.sample.HeavyContentMotionTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.api }}
          path: sample/build/reports/androidTests/
  demos:
    env:
      TRAY_ONLY: ${{ github.ref != 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[record-tray]') }}
      STACK_ONLY: ${{ github.ref != 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[record-stack]') }}
    # Main always records; feature branches can opt in with [record-demos], [record-stack], or [record-tray].
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.record_demos) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[record-demos]') || contains(github.event.head_commit.message, '[record-stack]') || contains(github.event.head_commit.message, '[record-tray]')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_4
          disk-size: 2048M
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            if [ "$TRAY_ONLY" = "true" ]; then python3 scripts/record-demos.py tray; elif [ "$STACK_ONLY" = "true" ]; then python3 scripts/record-demos.py stacked; else python3 scripts/record-demos.py; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: demo-videos
          path: docs/videos/

  publish-demos:
    # Artifacts only become README assets after every validation job succeeds.
    needs: [build, device, demos]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reject stale recordings
        id: current
        env:
          RECORDED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RECORDED_SHA" ]; then
            echo "::notice::Main moved while recording; a newer run will publish its demos."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: demo-videos
          path: ${{ runner.temp }}/demo-videos
      - name: Commit the recorded README assets
        if: steps.current.outputs.publish == 'true'
        env:
          RECORDINGS: ${{ runner.temp }}/demo-videos
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          source = Path(os.environ["RECORDINGS"])
          destination = Path("docs/videos")
          expected = {f"{scenario}.{extension}"
                      for scenario in ("detents", "chat", "contentFit", "stacked", "heavyContent", "scrollHandoff", "tray")
                      for extension in ("gif", "mp4")}
          actual = {p.name for p in source.iterdir()}
          if actual != expected:
              raise SystemExit(f"Unexpected demo files: missing={expected - actual}, extra={actual - expected}")
          for name in sorted(expected):
              asset = source / name
              if asset.is_symlink() or not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit(f"Invalid recording: {name}")
              shutil.copyfile(asset, destination / name)
          PY
          git add -- docs/videos/
          if git diff --cached --quiet; then
            echo "Recordings already match the README assets."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh demo videos after Android validation [skip ci]"
            # A racing source push is rejected rather than overwritten.
            git push origin HEAD:main
          fi
      - name: Start the requested release
        if: steps.current.outputs.publish == 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const properties = fs.readFileSync('gradle.properties', 'utf8');
            const version = properties.match(/^VERSION_NAME=(\S+)$/m)?.[1];
            if (!version || !/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error('VERSION_NAME must be an unprefixed semantic version');
            }
            const { data: current } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'main'
            });
            const { execSync } = require('child_process');
            if (current.sha !== execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim()) {
              throw new Error('Main moved after demo publication; release was not started');
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'release.yml', ref: 'main', inputs: { version }
            });
